<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoiceCoder · Microphone</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #17171a; --muted: #6b6b73; --line: #e6e4df;
    --accent: #e8553d; --ok: #1f9d6b; --warn: #c27c0e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f11; --surface: #17171a; --text: #ececef; --muted: #8b8b94; --line: #26262b; --accent: #ff6a50; --ok: #3ccf91; --warn: #e3a33a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--text); display: flex; align-items: center; justify-content: center; gap: 2px; }
  .mark i { display: block; width: 3px; background: var(--bg); border-radius: 2px; }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .listening .dot { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .error .dot { background: var(--warn); }
  canvas { width: 100%; height: 72px; display: block; border-radius: 10px; background: var(--bg); }
  .transcript { min-height: 48px; margin: 14px 0 6px; font-size: 16px; }
  .transcript .interim { color: var(--muted); }
  .last { font-size: 12px; color: var(--muted); min-height: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button { appearance: none; border: 1px solid var(--line); background: var(--text); color: var(--surface); font: inherit; font-weight: 600;
    padding: 9px 16px; border-radius: 9px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--muted); }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
  .msg { margin-top: 12px; font-size: 13px; color: var(--warn); min-height: 0; }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"><i style="height:8px"></i><i style="height:13px"></i><i style="height:6px"></i></span>VoiceCoder</div>
      <span class="state"><span class="dot"></span><span id="state">Connecting…</span></span>
    </header>
    <canvas id="wave" width="1040" height="144" aria-hidden="true"></canvas>
    <div class="transcript" id="transcript" aria-live="polite"><span class="interim">Say a command, e.g. “create a function that validates an email”.</span></div>
    <div class="last" id="last"></div>
    <div class="row">
      <button id="toggle" type="button">Start listening</button>
      <span class="hint" id="hint">Keep this tab open while you work in VS Code.</span>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>
</main>
<script src="mic.js"></script>
</body>
</html>
