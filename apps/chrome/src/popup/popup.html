<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceCoder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-dot" id="statusDot"></div>
        <span class="logo-text">VoiceCoder</span>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
    </div>

    <div class="warning" id="apiKeyWarning" style="display:none">
      <span>Add an API key in</span>
      <button class="link-btn" id="openSettingsLink">Settings</button>
      <span>to generate code. Undo, dictation and “go to line” work without one.</span>
    </div>

    <div class="toggle-section">
      <button class="toggle-btn" id="toggleBtn">
        <span class="toggle-label" id="toggleLabel">Start listening</span>
        <kbd class="shortcut">⌥ Space</kbd>
      </button>
    </div>

    <div class="lang-section">
      <label class="section-label" for="speechLang">Speech language</label>
      <select id="speechLang">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-IN">English (India)</option>
        <option value="hi-IN">हिन्दी · Hindi</option>
        <option value="te-IN">తెలుగు · Telugu</option>
      </select>
    </div>

    <div class="status-bar" id="statusBar">Click into a code editor, then press ⌥ Space.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
